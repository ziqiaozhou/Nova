[package]
name = "nova-snark"
version = "0.41.0"
authors = ["Srinath Setty <srinath@microsoft.com>"]
edition = "2021"
description = "High-speed recursive arguments from folding schemes"
documentation = "https://docs.rs/nova-snark/"
readme = "README.md"
repository = "https://github.com/Microsoft/Nova"
license-file = "LICENSE"
keywords = ["zkSNARKs", "cryptography", "proofs"]
rust-version = "1.87.0"

[dependencies]
ff = { version = "0.13.0", features = ["derive"] }
digest = "0.10"
sha3 = "0.10"
rayon = "1.10"
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
rand_chacha = "0.3"
subtle = "2.6.1"
halo2curves = { version = "0.9.0", features = ["std", "bits", "derive_serde"] }
generic-array = "1.2.0"
num-bigint = { version = "0.4.6", features = ["serde", "rand"] }
num-traits = "0.2.19"
num-integer = "0.1.46"
serde = { version = "1.0.217", features = ["derive"] }
bincode = { version = "2", features = ["serde", "std"] }
bitvec = "1.0"
blitzar = { version = "4.4.2", optional = true }
byteorder = "1.4.3"
thiserror = "2.0.11"
once_cell = "1.18.0"
itertools = "0.14.0"
gpu = {path = "../crates/gpu"}
#gpu = { git ="ssh://git@github.com/MSRSSP/rs-gpu.git", package = "gpu", rev = "9ee59855c01f36cc14750d962ede3e3afb8d0df6" }
gpu_host = {path = "../crates/gpu-host"}
#gpu_host = {git = "ssh://git@github.com/MSRSSP/rs-gpu.git", package = "gpu_host", rev = "9ee59855c01f36cc14750d962ede3e3afb8d0df6"}


[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.15", default-features = false, features = ["js"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
flate2 = "1.0.35"
hex = "0.4.3"
pprof2 = { version = "0.13" }
cfg-if = "1.0.0"
sha2 = "0.10.7"
proptest = "1.6.0"
rand = "0.8.5"
expect-test = "1.5.1"

[patch.crates-io]
halo2curves = {path = "../halo2curves"}
#halo2curves = { git = "https://github.com/ziqiaozhou/halo2curves", rev="3b5a9b0e6c80950ef3046c721cd758e03260f445" }

[[bench]]
name = "recursive-snark"
harness = false

[[bench]]
name = "compressed-snark"
harness = false

[[bench]]
name = "sha256"
harness = false

[[bench]]
name = "ppsnark"
harness = false

[[bench]]
name = "commit"
harness = false

[[bench]]
name = "sumcheckeq"
harness = false

[[bench]]
name = "msm-gpu"
harness = false


[features]
default = ["halo2curves/asm"]
flamegraph = ["pprof2/flamegraph", "pprof2/criterion"]
experimental = []
gpu = []
